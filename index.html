<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estimado On-Site — The Hillcrest Company</title>
<style>
  :root{
    --green:#1e5c3f; --gold:#c9a227; --ink:#2b2b26; --mut:#8a8577;
    --bg:#f7f5ee; --card:#ffffff; --line:#e8e2d2; --soft:#fbf9f3;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:90px;}
  header{background:var(--green); color:#fff; padding:18px 16px 14px; position:relative;}
  header h1{margin:0; font-size:20px;}
  header p{margin:6px 0 0; font-size:12px; opacity:.92; line-height:1.45;}
  .langwrap{position:absolute; top:14px; right:12px; display:flex; gap:6px;}
  .langbtn{background:rgba(255,255,255,.18); color:#fff; border:1.5px solid rgba(255,255,255,.65); border-radius:20px; padding:4px 12px; font-size:12px; font-weight:700; cursor:pointer;}
  .langbtn.on{background:#fff; color:var(--green); border-color:#fff;}
  .brand{display:inline-block; background:#fff; border-radius:12px; padding:8px 16px;
    margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.18);}
  .brand img{display:block; height:46px; width:auto;}
  main{max-width:860px; margin:0 auto; padding:12px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(30,60,40,.06);}
  .card h2{margin:0 0 10px; font-size:15px; color:var(--green);}
  .note{font-size:11.5px; color:var(--mut); margin:8px 0 0; line-height:1.5;}
  label.f{display:block; font-size:11px; color:var(--mut); margin:0 0 3px;}
  input[type=number],input[type=text]{width:100%; padding:10px 10px; font-size:15px;
    border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--gold); outline-offset:-1px; border-color:var(--gold);}
  select{width:100%; padding:10px 10px; font-size:15px; border:1px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  .fees{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px;}
  .sec{border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; background:var(--soft);}
  .sec-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .sec-head b{font-size:13px; color:var(--green);}
  .sec-head button{background:none; border:none; color:#b04a3a; font-size:12px; cursor:pointer; padding:4px;}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap;}
  button.big{flex:1 1 140px; padding:13px 10px; font-size:15px; border-radius:12px; border:1px solid var(--line);
    background:#fff; cursor:pointer; font-weight:600; color:var(--ink);}
  button.big.primary{background:var(--green); color:#fff; border-color:var(--green);}
  button.big.warn{background:#fff; color:#b04a3a; border-color:#e5c4bc;}
  button.big:active{transform:scale(.98);}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{background:var(--soft); border:1px solid var(--line); border-radius:999px;
    padding:7px 12px; font-size:12.5px;}
  .chip b{color:var(--green);}
  .tabs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .tab{padding:9px 14px; border-radius:999px; border:1.5px solid var(--line); background:#fff;
    font-size:13px; font-weight:700; color:var(--ink); cursor:pointer;}
  .tab.on{background:var(--green); color:#fff; border-color:var(--green);}
  .tscroll{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--mut);
    text-align:left; padding:8px 6px; border-bottom:2px solid var(--line);}
  td{padding:7px 6px; border-bottom:1px solid #f1ede0; vertical-align:middle;}
  td.n, th.n{text-align:right; white-space:nowrap;}
  td input[type=number]{padding:7px 6px; font-size:13px; text-align:right;}
  tr.total td{border-top:2px solid var(--green); border-bottom:none; font-weight:800; font-size:14px; padding-top:10px;}
  .chk{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line);
    border-radius:10px; background:var(--soft); margin-bottom:10px; cursor:pointer; font-size:14px;}
  .chk input{width:20px; height:20px; accent-color:var(--green);}
  .addr-wrap{position:relative;}
  .addr-list{position:absolute; top:100%; left:0; right:0; background:#fff; border:1px solid var(--line);
    border-radius:10px; margin-top:4px; box-shadow:0 8px 22px rgba(0,0,0,.14); z-index:60;
    display:none; max-height:230px; overflow:auto;}
  .addr-list.show{display:block;}
  .addr-item{padding:10px 12px; font-size:14px; border-bottom:1px solid #f0ede2; cursor:pointer;}
  .addr-item:last-child{border-bottom:none;}
  .addr-item small{display:block; color:var(--mut); font-size:11.5px; margin-top:2px;}
  #shareCard{display:none;}
  #shareCard.show{display:block;}
  #shareText{width:100%; height:150px; font-size:12px; border:1px solid var(--line); border-radius:10px; padding:10px;}
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px);    background:#2b2b26; color:#fff; padding:12px 18px; border-radius:999px; font-size:14px;
    opacity:0; pointer-events:none; transition:all .25s; z-index:99; max-width:92vw; text-align:center;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  #gabyModal{position:fixed; inset:0; background:rgba(20,25,20,.55); display:none; align-items:flex-end; justify-content:center; z-index:60; padding:0;}
  #gabyModal.show{display:flex;}
  #gabySheet{background:#fff; border-radius:18px 18px 0 0; width:100%; max-width:560px; max-height:88vh; overflow:auto; padding:18px 16px 26px;}
  #gabySheet h2{margin:0 0 6px;}
  #gabySheet textarea{width:100%; min-height:84px; border:1px solid var(--line); border-radius:10px; padding:10px; font-size:14px; font-family:inherit; box-sizing:border-box;}
  #gabySum{font-size:13px; color:var(--mut); margin:8px 0;}
  #gabySum b{color:var(--ink);}
  .ver-tag{position:fixed; right:10px; bottom:8px; font-size:10px; color:#b9b3a1;}
</style>
</head>

<script>
"use strict";
/* ================= Utilidades ================= */
const $=id=>document.getElementById(id);
const num=v=>{const n=parseFloat(v);return isFinite(n)&&n>0?n:0;};
const fmt=n=>"$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const pdfEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/\(/g,"\\(").replace(/\)/g,"\\)");

const LS_KEY="onsiteEstimate1";
function emptyRoom(){return {lvl:"Main",name:"",L:"",W:"",H:"",vaulted:0,doors:"",closets:"",windows:""};}
function defaultState(){return {
  client:"", address:"", rooms:[emptyRoom()],
  wallRate:1.50, ceilRate:2.50, baseRate:7.00, paintWall:55, paintCeil:30, paintBase:85,
  trad:6.00, peel:7.00, removal:10.00,
  pencil:20.00, traditional:30.00, custom:50.00,
  primeWall:1.00, primeCeil:1.25, skimWall:2.00, skimCeil:3.00,
  flat:7.00, knockdown:6.00, popcorn:5.00,
  doorDed:21, closetDed:21, winDed:12,
  trade:"painting", scope:"all", lang:"es"
};}
function normalize(st){
  if(!st||typeof st!=="object") return defaultState();
  const d=defaultState(), g=(v,fb)=>v===""||v==null?fb:num(v);
  const gi=(v,fb)=>v===""||v==null?fb:(num(v)?1:0);
  const rooms=(Array.isArray(st.rooms)&&st.rooms.length?st.rooms:[emptyRoom()]).map(r=>({
    lvl:LEVELS.indexOf(r.lvl)>=0?r.lvl:"Main",
    name:typeof r.name==="string"?r.name:"",
    L:g(r.L,""),W:g(r.W,""),H:g(r.H,""),vaulted:gi(r.vaulted,0),
    doors:g(r.doors,""),closets:g(r.closets,""),windows:g(r.windows,"")
  }));
  const o={client:typeof st.client==="string"?st.client:"",
    address:typeof st.address==="string"?st.address:"", rooms:rooms,
    trade:TRADES[st.trade]?st.trade:"painting",
    scope:SCOPES.indexOf(st.scope)>=0?st.scope:"all",
    lang:st.lang==="en"?"en":"es"};
  SET_KEYS.forEach(k=>{o[k]=g(st[k],d[k]);});
  return o;
}
function loadState(){
  let st=null;
  try{ const raw=localStorage.getItem(LS_KEY); if(raw) st=normalize(JSON.parse(raw)); }catch(e){ st=null; }
  return st||defaultState();
}
let state=loadState();
function save(){ try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){} }

                    :d.getDate()+" "+M[d.getMonth()]+" "+d.getFullYear();}

/* ================= Cálculos (réplica de "Master - OnSite Estimate - Advance") ================= */
function roomCalc(r){
  const L=num(r.L),W=num(r.W),H=num(r.H),v=r.vaulted?1:0;
  const doors=Math.floor(num(r.doors)),closets=Math.floor(num(r.closets)),wins=Math.floor(num(r.windows));
  // La hoja pedía puertas/ventanas pero nunca las descontaba — ahora sí se descuentan.
  const walls=Math.max(0,((L*H)+(W*H))*2
    -doors*num(state.doorDed)-closets*num(state.closetDed)-wins*num(state.winDed));
  const ceilSq=(L*W)*(1+0.30*v);
  const base=(L+W)*2;
  // --- Pintura ---
  const laborW=walls*num(state.wallRate),laborC=ceilSq*num(state.ceilRate),laborB=base*num(state.baseRate);
  const gW=Math.ceil(walls/180),gC=Math.ceil(ceilSq/125),gB=Math.ceil(base/150);
  const paintW=gW*num(state.paintWall),paintC=gC*num(state.paintCeil),paintB=gB*num(state.paintBase);
  const pLabor=laborW+laborC+laborB,pPaint=paintW+paintC+paintB,pTotal=pLabor+pPaint;
  // --- Wallpaper ---
  const wTrad=walls*num(state.trad),wPeel=walls*num(state.peel),wRem=walls*num(state.removal);
  // --- Wainscoting (36" = 3 ft, con la altura de CADA habitación) ---
  const wnPen=walls*num(state.pencil),wnTra=walls*num(state.traditional),wnCus=walls*num(state.custom);
  const f36=H>0?3/H:0;
  const wnPen36=wnPen*f36,wnTra36=wnTra*f36,wnCus36=wnCus*f36;
  // --- Prime y skimcoat (el primer de paredes usa $/gal de pintura de pared, como el total de la hoja) ---
  const prW=walls*num(state.primeWall),prC=ceilSq*num(state.primeCeil);
  const primer=Math.ceil(walls/180)*num(state.paintWall)+Math.ceil(ceilSq/125)*num(state.paintCeil);
  const prLabor=prW+prC;
  const skW=walls*num(state.skimWall),skC=ceilSq*num(state.skimCeil),skim=skW+skC;
  // --- Texturas (por ft² de techo) ---
  const tFlat=ceilSq*num(state.flat),tKnock=ceilSq*num(state.knockdown),tPop=ceilSq*num(state.popcorn);
  return {hgt:H,walls:walls,ceilSq:ceilSq,base:base,
    laborW:laborW,laborC:laborC,laborB:laborB,gW:gW,gC:gC,gB:gB,
    paintW:paintW,paintC:paintC,paintB:paintB,pLabor:pLabor,pPaint:pPaint,pTotal:pTotal,
    wTrad:wTrad,wPeel:wPeel,wRem:wRem,
    wnPen:wnPen,wnTra:wnTra,wnCus:wnCus,wnPen36:wnPen36,wnTra36:wnTra36,wnCus36:wnCus36,
    prW:prW,prC:prC,prLabor:prLabor,primer:primer,skW:skW,skC:skC,skim:skim,
    tFlat:tFlat,tKnock:tKnock,tPop:tPop};
}
const SUM_KEYS=["walls","ceilSq","base","pLabor","pPaint","pTotal","wTrad","wPeel","wRem",
  "wnPen","wnTra","wnCus","wnPen36","wnTra36","wnCus36","prLabor","primer","skim",
  "tFlat","tKnock","tPop"];
function calc(){
  const rows=state.rooms.map((r,i)=>{const o=roomCalc(r);o.i=i;o.lvl=r.lvl;o.name=r.name;return o;});
  const sum=arr=>{const o={};SUM_KEYS.forEach(k=>o[k]=0);arr.forEach(x=>SUM_KEYS.forEach(k=>o[k]+=x[k]||0));return o;};
  const combined=sum(rows);combined.prPrime=combined.prLabor+combined.primer;
  const byLevel={};
  LEVELS.forEach(lv=>{const s=sum(rows.filter(x=>x.lvl===lv));s.prPrime=s.prLabor+s.primer;byLevel[lv]=s;});
  return {rows:rows,combined:combined,byLevel:byLevel};
}

/* ================= Dirección (autocompletado) ================= */
let addrTimer=null;
function initAddress(){
  const inp=$("addrInput"),list=$("addrList");
  inp.value=state.address||"";
  inp.addEventListener("input",()=>{
    state.address=inp.value;save();
    clearTimeout(addrTimer);
    const q=inp.value.trim();
    if(q.length<4){list.classList.remove("show");return;}
    addrTimer=setTimeout(async()=>{
      try{
        const url="https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=us&limit=6&addressdetails=1&q="+encodeURIComponent(q);
        const arr=await (await fetch(url,{headers:{"Accept":"application/json"}})).json();
        if(!Array.isArray(arr)||!arr.length){list.classList.remove("show");return;}
        list.innerHTML="";
        arr.forEach(a=>{
          const ad=a.address||{};
          const street=[ad.house_number,ad.road].filter(Boolean).join(" ");
          const city=ad.city||ad.town||ad.village||ad.hamlet||"";
          const label=[street,city,ad.state,ad.postcode].filter(Boolean).join(", ")||a.display_name;
          const dd=document.createElement("div");dd.className="addr-item";
          const parts=String(a.display_name).split(",");
          dd.innerHTML="<b>"+esc(parts[0])+"</b><small>"+esc(parts.slice(1).join(",").trim())+"</small>";
          dd.addEventListener("click",()=>{state.address=label;inp.value=label;save();list.classList.remove("show");});
          list.appendChild(dd);
        });
        list.classList.add("show");
      }catch(e){list.classList.remove("show");}
    },450);
  });
  inp.addEventListener("keydown",e=>{if(e.key==="Escape")list.classList.remove("show");});
  document.addEventListener("click",e=>{if(!e.target.closest||!e.target.closest(".addr-wrap"))list.classList.remove("show");});
}

  clearTimeout(el._h);el._h=setTimeout(()=>el.classList.remove("show"),2600);
}
function initButtons(){
  $("addRoom").addEventListener("click",()=>{state.rooms.push(emptyRoom());save();renderRooms();renderTrade();});
  // REINICIAR: borra habitaciones, cliente y dirección; conserva precios, oficio, alcance e idioma

/* ================= Enviar a Gaby: traspaso por correo ================= */
const GABY_MAIL="projects@thehillcrestcompany.com";
const HANDOFF_KEYS=[
  ["pTotal","pTotal"],["wTrad","wTrad"],["wPeel","wPeel"],["wRem","wRem"],
  ["wnPen","wnPen"],["wnTra","wnTra"],["wnCus","wnCus"],
  ["wnPen36","wnPen36"],["wnTra36","wnTra36"],["wnCus36","wnCus36"],
  ["prPrime","prPrime"],["skim","skim"],["tFlat","tFlat"],["tKnock","tKnock"],["tPop","tPop"]
];
function handoffTotals(c){
  const o={};HANDOFF_KEYS.forEach(([k])=>{o[k]=Math.round((c.combined[k]||0)*100)/100;});return o;
}
function buildHandoff(){
  const c=calc();
  const data={
    v:1,
    client:state.client||"",
    address:state.address||"",
    date:new Date().toISOString().slice(0,10),
    lang:lang,
    rooms:state.rooms.map(r=>({n:r.name||"",lvl:r.lvl,L:+r.L||0,W:+r.W||0,H:+r.H||0,
      v:r.vault?1:0,d:+r.doors||0,cd:+r.cdoors||0,w:+r.wins||0})),
    rates:Object.assign({},state.rates),
    totals:handoffTotals(c),
    comment:($("gabyComment").value||"").trim()
  };
  return data;
}
function handoffSubject(d){
  return "[OnSite-Gaby] "+(d.client||"")+(d.address?" — "+d.address:"");
}
function handoffBody(d){
  const lines=[];
  lines.push((lang==="es"?"Cliente":"Client")+": "+(d.client||"—"));
  if(d.address)lines.push((lang==="es"?"Dirección":"Address")+": "+d.address);
  lines.push((lang==="es"?"Fecha":"Date")+": "+d.date);
  lines.push((lang==="es"?"Habitaciones":"Rooms")+": "+d.rooms.length);
  lines.push("");
  lines.push(lang==="es"?"TOTALES POR OFICIO:":"TRADE TOTALS:");
  HANDOFF_KEYS.forEach(([k])=>{
    lines.push("  "+k+": $"+(d.totals[k]||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}));
  });
  if(d.comment){lines.push("");lines.push((lang==="es"?"Instrucciones":"Instructions")+": "+d.comment);}
  lines.push("");
  lines.push("---BEGIN-ONSITE-DATA---");
  lines.push(JSON.stringify(d));
  lines.push("---END-ONSITE-DATA---");
  return lines.join("\n");
}
function openGabyModal(){
  if(!(state.client||"").trim()){toast(t("gabyNeedClient"));return;}
  const c=calc(),d=buildHandoff();
  const bits=HANDOFF_KEYS.filter(([k])=>(d.totals[k]||0)>0)
    .map(([k])=>"<b>"+k+"</b>: $"+d.totals[k].toLocaleString("en-US",{maximumFractionDigits:0}));
  $("gabySum").innerHTML=
    "<b>"+escHtml(d.client)+"</b>"+(d.address?" · "+escHtml(d.address):"")+
    " · "+d.rooms.length+" "+(lang==="es"?"hab.":"rms")+"<br>"+bits.join(" · ");
  $("gabyModal").classList.add("show");
}
function sendGabyMail(){
  const d=buildHandoff();
  const href="mailto:"+GABY_MAIL+"?subject="+encodeURIComponent(handoffSubject(d))+"&body="+encodeURIComponent(handoffBody(d));
  toast(t("gabyMailOpen"));
  const a=document.createElement("a");a.href=href;a.style.display="none";
  document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500);
  setTimeout(()=>$("gabyModal").classList.remove("show"),800);
}
function copyGabyText(){
  const d=buildHandoff();
  const txt=handoffSubject(d)+"\n\n"+handoffBody(d);
  const done=()=>toast(t("gabyHandoffCopied"));
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));}
  else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");done();}catch(e){toast(t("copyManual"));}
  ta.remove();
}
function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ================= PDF del estimado (horizontal, alcance elegible) ================= */
const GREEN="0.118 0.361 0.247",GOLD="0.788 0.635 0.153",DARK="0.17 0.17 0.15",GRAY="0.54 0.52 0.47";
const pdfSan=s=>String(s).replace(/\u2014/g,"-").replace(/\u2013/g,"-").replace(/\u2018|\u2019/g,"'").replace(/\u201c|\u201d/g,'"');
function T(P,x,y,txt,size,bold,color){
  P.s+="BT /F"+(bold?"2":"1")+" "+size+" Tf "+color+" rg "+x.toFixed(1)+" "+y.toFixed(1)+" Td ("+pdfEsc(pdfSan(txt))+") Tj ET\n";
}
function rect(P,x,y,w,h,color){P.s+=color+" rg "+x+" "+y+" "+w+" "+h+" re f\n";}
function newPage(){return {s:""};}
function pageHead(P,title){
  P.s+="q 190 0 0 41.1 36 560 cm /Im1 Do Q\n";
  T(P,36,542,title,12,true,DARK);
  let y=526;
  const info=(state.client.trim()?t("clientLabel")+state.client.trim()+" · ":"")
    +(state.address.trim()?t("projLabel")+state.address.trim()+" · ":"")
    +t("dateLabel")+": "+PDD();
  T(P,36,y,info.length>118?info.slice(0,118):info,8.5,false,GRAY);
  y-=14;
  rect(P,36,y-4,720,2.5,GOLD);
  return y-14;
}
function buildSummaryPage(){
  const P=newPage(),c=calc();
  let y=pageHead(P,t("sumPdfT"));
  const cx=[36,560];
  rect(P,36,y-6,720,20,GREEN);
  T(P,cx[0]+4,y,t("iItem"),9,true,"1 1 1");
  T(P,cx[1]+4,y,t("iCost"),9,true,"1 1 1");
  y-=24;
  summaryRows().forEach((r,i)=>{
    rect(P,36,y-6,720,20,i%2?"0.96 0.97 0.94":"1 1 1");
    const lbl=nm(r.label);
    T(P,cx[0]+4,y,lbl.length>72?lbl.slice(0,72):lbl,9,false,DARK);
    T(P,cx[1]+4,y,fmt(c.combined[r.k]),9,true,DARK);
    y-=24;
  });
  T(P,36,60,t("termNote"),8,false,GRAY);
  T(P,36,44,"The Hillcrest Company · 612-741-9863",8.5,true,GREEN);
  return P.s;
}
function buildTradePages(trade){
  const c=calc(),cols=COLS[trade];
  const baseTitle=nm(TRADES[trade].name).toUpperCase()+" — "+t("roomDetailT").toUpperCase();
  const roomW=140,lvlW=54;
  const tabW=roomW+lvlW+cols.reduce((a,cc)=>a+cc.w,0);
  const xs=[];let xx=36+roomW+lvlW;
  cols.forEach(cc=>{xs.push(xx);xx+=cc.w;});
  const pages=[];let P=newPage();
  function headRow(y){
    rect(P,36,y-6,tabW,20,GREEN);
    T(P,40,y,t("colRoom"),8,true,"1 1 1");
    T(P,40+roomW,y,t("colLevel"),8,true,"1 1 1");
    cols.forEach((cc,i)=>T(P,xs[i]+4,y,nm(cc.label),7.5,true,"1 1 1"));
    return y-24;
  }
  function totalRow(y,agg,label,bold){
    rect(P,36,y-6,tabW,20,bold?"0.90 0.93 0.88":"1 1 1");
    const col=bold?GREEN:DARK;
    T(P,40,y,label,8.5,true,col);
    cols.forEach((cc,i)=>T(P,xs[i]+4,y,cellFmt(cc,agg[cc.k]),8.5,true,col));
    return y-22;
  }
  let y=pageHead(P,baseTitle);
  y=headRow(y);
  c.rows.forEach((r,ri)=>{
    if(y<140){pages.push(P.s);P=newPage();y=pageHead(P,baseTitle+" ("+(pages.length+1)+")");y=headRow(y);}
    if(ri%2) rect(P,36,y-6,tabW,20,"0.96 0.97 0.94");
    const rn=((r.name||"").trim())||(t("roomN")+(r.i+1));
    T(P,40,y,rn.length>24?rn.slice(0,24):rn,8,false,DARK);
    T(P,40+roomW,y,nm(LVL_NAME[r.lvl]),8,false,DARK);
    cols.forEach((cc,i)=>T(P,xs[i]+4,y,cellFmt(cc,r[cc.k]),8,cc.t==="m",DARK));
    y-=20;
  });
  if(y<60+(1+LEVELS.length)*22+10){pages.push(P.s);P=newPage();y=pageHead(P,baseTitle+" ("+(pages.length+1)+")");y=headRow(y);}
  y-=6;
  y=totalRow(y,c.combined,t("combRow"),true);
  LEVELS.forEach(lv=>{y=totalRow(y,c.byLevel[lv],nm(LVL_NAME[lv]),false);});
  T(P,36,44,"The Hillcrest Company · 612-741-9863",8.5,true,GREEN);
  pages.push(P.s);
  return pages;
}
function assemblePDF(pages){
  const n=pages.length;
  const f1=3+n,f2=4+n,im=5+n,c0=6+n;
  const objs=[];
  objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
  let kids="";for(let i=0;i<n;i++)kids+=(3+i)+" 0 R ";
  objs[2]="<< /Type /Pages /Kids ["+kids.trim()+"] /Count "+n+" >>";
  const res="<< /Font << /F1 "+f1+" 0 R /F2 "+f2+" 0 R >> /XObject << /Im1 "+im+" 0 R >> >>";
  for(let i=0;i<n;i++)objs[3+i]="<< /Type /Page /Parent 2 0 R /MediaBox [0 0 792 612] /Resources "+res+" /Contents "+(c0+i)+" 0 R >>";
  objs[f1]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
  objs[f2]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
  objs[im]="<< /Type /XObject /Subtype /Image /Width "+LOGO_W+" /Height "+LOGO_H+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+LOGO_BIN.length+" >>\nstream\n"+LOGO_BIN+"endstream";
  for(let i=0;i<n;i++)objs[c0+i]="<< /Length "+pages[i].length+" >>\nstream\n"+pages[i]+"endstream";
  const total=c0+n;
  let pdf="%PDF-1.4\n",offs=[0];
  for(let i=1;i<total;i++){offs[i]=pdf.length;pdf+=i+" 0 obj\n"+objs[i]+"\nendobj\n";}
  const xoff=pdf.length;
  pdf+="xref\n0 "+total+"\n0000000000 65535 f \n";
  for(let i=1;i<total;i++)pdf+="0000000000".slice(0,10-String(offs[i]).length)+offs[i]+" 00000 n \n";
  pdf+="trailer\n<< /Size "+total+" /Root 1 0 R >>\nstartxref\n"+xoff+"\n%%EOF";
  const bytes=new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++)bytes[i]=pdf.charCodeAt(i)&255;
  return bytes;
}
function buildEstimatePdf(){
  const pages=[];
  if(state.scope==="all"){
    pages.push(buildSummaryPage());
    ["painting","wallpaper","wainscoting","primeskim","textures"].forEach(tr=>{
      buildTradePages(tr).forEach(p=>pages.push(p));
    });
  }else{
    buildTradePages(state.scope).forEach(p=>pages.push(p));
  }
  return assemblePDF(pages);
}
function estimateText(){
  const c=calc(),L=[];
  L.push(t("estTitle"));
  if(state.client.trim())L.push(t("clientLabel")+state.client.trim());
  if(state.address.trim())L.push(t("projLabel")+state.address.trim());
  L.push(t("dateLabel")+": "+PDD());
  L.push("");
  summaryRows().forEach((r,i)=>{L.push((i+1)+". "+nm(r.label)+": "+fmt(c.combined[r.k]));});
  L.push("");
  L.push("The Hillcrest Company · 612-741-9863");
  return L.join("\n");
}
async function sharePdf(){
  var card=$("shareCard"),msg=$("copyMsg");
  card.classList.add("show");
  msg.textContent=t("pdfGen");
  try{
    var bytes=buildEstimatePdf();
    var blob=new Blob([bytes.buffer],{type:"application/pdf"});
    var file;
    try{file=new File([blob],"Estimado-OnSite-Hillcrest.pdf",{type:"application/pdf"});}
    catch(fe){file=blob;}
    var txt=estimateText();
    $("shareText").value=txt;
    var shared=false;
    if(navigator.canShare){
      try{
        if(navigator.canShare({files:[file]})){
          try{
            await navigator.share({files:[file],title:"Estimado On-Site Hillcrest"});
            msg.textContent=t("pdfShared");
            return;
          }catch(se){if(se&&se.name==="AbortError")return;}
        }
      }catch(ce){shared=false;}
    }
    if(!shared){
      var url=URL.createObjectURL(blob);
      var w=null;
      try{w=window.open(url,"_blank");}catch(oe){w=null;}
      if(w){
        msg.textContent=t("pdfOpened");
      }else{
        msg.innerHTML=t("pdfBlocked")+
          '<a href="'+url+'" target="_blank" rel="noopener">'+t("openPdf")+'</a>';
      }
      setTimeout(function(){URL.revokeObjectURL(url);},120000);
    }
  }catch(err){
    msg.textContent=t("pdfFail")+(err&&err.message?err.message:String(err));
  }
}
